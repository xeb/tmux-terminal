[package]
name = "tmux-terminal"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
tempfile = "3"
chrono = "0.4"
regex = "1"
futures = "0.3"
base64 = "0.22"
